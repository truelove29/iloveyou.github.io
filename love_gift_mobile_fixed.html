<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160f20">
<title>Для тебя ♡</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#38233d,#211729 48%,#100d18);color:#fff;font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent}
.scene{position:relative;width:100%;height:100svh;min-height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.glow{position:absolute;width:min(78vw,340px);aspect-ratio:1;border-radius:50%;background:#ff4e8a;filter:blur(85px);opacity:.11;pointer-events:none;transition:opacity 1.5s}
#heartButton{position:relative;z-index:3;border:0;background:transparent;color:white;font:normal clamp(58px,18vw,78px)/1 Georgia,serif;padding:22px;cursor:pointer;filter:drop-shadow(0 0 13px #ffffff55);animation:pulse 1.8s ease-in-out infinite;transition:opacity .3s,transform .3s}
#heartButton:active{transform:scale(.88)}
@keyframes pulse{50%{transform:scale(1.09)}}
.caption{z-index:3;margin:18px 0 0;min-height:1.5em;text-align:center;font-size:clamp(14px,4vw,17px);letter-spacing:.04em;color:#f4eaf4}
#heartCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.assembled{position:absolute;z-index:2;left:50%;top:43%;width:min(68vw,290px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.2);opacity:0;filter:drop-shadow(0 0 20px #ff325a88)}
.assembled svg{width:100%;height:100%;overflow:visible}
.assembled path{fill:#ff174f}
.assembled.show{opacity:1;animation:pop .8s cubic-bezier(.2,1.5,.4,1) forwards}
.assembled.rainbow path{fill:url(#rainbow);animation:shine 1.2s linear infinite}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes shine{to{filter:hue-rotate(360deg) brightness(1.15)}}
.done .glow{opacity:.24}.done .caption{color:#ffb8ca;font-size:clamp(20px,5.5vw,25px);font-weight:bold;text-shadow:0 0 18px #ff467899}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="scene" id="scene">
<div class="glow"></div><canvas id="heartCanvas"></canvas>
<button id="heartButton" aria-label="Нажми на сердечко">♡</button>
<div class="assembled" id="assembled" aria-hidden="true">
<svg viewBox="0 0 100 100" aria-hidden="true">
<defs><linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ff4b8b"/><stop offset="25%" stop-color="#ffb347"/><stop offset="50%" stop-color="#fff06a"/><stop offset="75%" stop-color="#65e8c5"/><stop offset="100%" stop-color="#9d79ff"/>
</linearGradient></defs>
<path d="M50 88 C43 81 8 57 8 31 C8 8 38 2 50 26 C62 2 92 8 92 31 C92 57 57 81 50 88Z"/>
</svg></div>
<p class="caption" id="caption">Нажми на сердечко</p>
</main>
<script>
(()=>{
const scene=document.getElementById('scene'),button=document.getElementById('heartButton'),caption=document.getElementById('caption');
const canvas=document.getElementById('heartCanvas'),ctx=canvas.getContext('2d'),assembled=document.getElementById('assembled');
let started=false,particles=[];
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function point(t,s){return{x:16*Math.pow(Math.sin(t),3)*s,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s}}
function launch(){
 if(started)return;started=true;
 button.style.opacity='0';button.style.pointerEvents='none';button.style.animation='none';
 setTimeout(()=>button.remove(),350);caption.textContent='';
 const cx=innerWidth/2,cy=innerHeight*.43,scale=Math.min(innerWidth*.0105,2.65),count=112;
 // Равномерно заполняем внутреннюю площадь сердца: несколько вложенных контуров.
 for(let ring=0;ring<7;ring++){
  const factor=1-ring*.125,n=Math.round(count*(1-ring*.09));
  for(let i=0;i<n;i++){
   const t=i/n*Math.PI*2,p=point(t,scale*factor),side=i%2?-1:1;
   const sx=cx+side*(10+Math.random()*15),sy=cy+45+Math.random()*15;
   particles.push({sx,sy,tx:cx+p.x,ty:cy+p.y,delay:particles.length*5+ring*90,size:7+Math.random()*4,color:['#ff5c9a','#ffb45c','#ffe66d','#66e6c4','#72b7ff','#b58aff'][i%6],w:Math.random()*6.28});
  }
 }
 const start=performance.now();
 function draw(now){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const p of particles){
   const q=Math.max(0,Math.min(1,(now-start-p.delay)/1500)),e=1-Math.pow(1-q,3);
   const arc=Math.sin(q*Math.PI)*(p.sx<cx?-1:1)*28;
   const x=p.sx+(p.tx-p.sx)*e+arc*(1-q),y=p.sy+(p.ty-p.sy)*e-Math.sin(q*Math.PI)*35;
   ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(now/250+p.w)*.22);ctx.globalAlpha=Math.min(1,q*4);
   ctx.fillStyle=p.color;ctx.font=`${p.size*1.8}px Georgia`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♥',0,0);ctx.restore();
  }
  if(now-start<3300)requestAnimationFrame(draw);
  else{
   ctx.clearRect(0,0,innerWidth,innerHeight);assembled.classList.add('show','rainbow');
   setTimeout(()=>{assembled.classList.remove('rainbow');scene.classList.add('done');caption.textContent='Я люблю тебя!'},2300);
  }
 }
 requestAnimationFrame(draw);
}
button.addEventListener('click',launch);
})();
</script>
</body></html>
